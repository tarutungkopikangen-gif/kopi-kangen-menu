<style>
  /* ================= ROOT THEME ================= */
  :root{
    --bg:#f7f9fb;
    --bg-soft:#eef2f5;
    --card:#ffffff;
    --text:#222;
    --muted:#777;
    --primary:#00a8a8;
    --primary-soft:#1ec9c9;
    --border:#ddd;
    --shadow:0 6px 14px rgba(0,0,0,.06);
  }
  
  body.dark{
    --bg:#0f1115;
    --bg-soft:#151922;
    --card:#1c2230;
    --text:#f1f5f9;
    --muted:#9ca3af;
    --primary:#22d3ee;
    --primary-soft:#67e8f9;
    --border:#2b3242;
    --shadow:0 8px 20px rgba(0,0,0,.4);
  }
  
  *{
    font-family:'Segoe UI',sans-serif;
    box-sizing:border-box;
    transition:background .25s,color .25s,border .25s;
  }
  
  body{
    margin:0;
    background:linear-gradient(180deg,var(--bg),var(--bg-soft));
    color:var(--text);
    overflow-x:hidden;
  }
  
  /* ================= HEADER ================= */
  .header{
    background:var(--card);
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    animation:fadeDown .5s ease;
  }
  
  .main-logo{
    height:42px;
    width:auto;
    display:block;
    transition:filter .3s ease;
  }
  body.dark .main-logo{
    filter:invert(1) brightness(2);
  }
  
  .theme-toggle{
    border:none;
    background:transparent;
    font-size:18px;
    cursor:pointer;
    padding:6px 8px;
    border-radius:8px;
  }
  .theme-toggle:hover{background:rgba(0,0,0,.05)}
  body.dark .theme-toggle:hover{background:rgba(255,255,255,.08)}
  
  @keyframes fadeDown{
    from{opacity:0;transform:translateY(-20px)}
    to{opacity:1;transform:translateY(0)}
  }
  
  /* ================= HERO ================= */
  .hero{
    padding:14px;
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    animation:fadeUp .6s ease;
    position:relative;
  }
  
  .hero-hint{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(135deg,var(--primary),var(--primary-soft));
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    box-shadow:0 8px 20px rgba(0,168,168,.4);
    z-index:10;
    animation:floatHint 1.6s ease-in-out infinite;
    pointer-events:none;
  }
  
  @keyframes floatHint{
    0%,100%{transform:translate(-50%,-50%) translateY(0)}
    50%{transform:translate(-50%,-50%) translateY(-8px)}
  }
  
  .hero-card{
    background:var(--card);
    border-radius:22px;
    padding:0;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:.35s cubic-bezier(.25,.8,.25,1);
    position:relative;
    overflow:hidden;
    min-height:340px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }
  
  .hero-card:hover{
    transform:translateY(-6px) scale(1.015);
    box-shadow:0 16px 32px rgba(0,0,0,.18);
  }
  
  .hero-card::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55));
    opacity:0;
    transition:.35s;
  }
  .hero-card:hover::after{opacity:1}
  
  .hero-card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s ease;
  }
  .hero-card:hover img{transform:scale(1.05)}
  
  .hero-card b{
    position:relative;
    z-index:2;
    width:100%;
    padding:18px 16px;
    font-size:20px;
    font-weight:700;
    color:#fff;
    text-align:left;
    background:linear-gradient(to top,rgba(0,0,0,.65),transparent);
  }
  
  @media(min-width:768px){
    .hero{
      grid-template-columns:1fr 1fr;
      padding:20px;
    }
    .hero-card{min-height:420px}
  }
  
  /* ================= CATEGORY ================= */
  .category{
    display:none;
    gap:8px;
    padding:10px 12px;
    overflow-x:auto;
    background:var(--bg-soft);
    position:sticky;
    top:58px;
    z-index:15;
    animation:slideDown .4s ease;
  }
  @keyframes slideDown{
    from{opacity:0;transform:translateY(-10px)}
    to{opacity:1;transform:translateY(0)}
  }
  .category::-webkit-scrollbar{display:none}
  .category button{
    flex:0 0 auto;
    padding:7px 16px;
    border-radius:999px;
    border:none;
    background:rgba(0,0,0,.05);
    font-size:13px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    transition:.25s;
  }
  body.dark .category button{
    background:rgba(255,255,255,.08);
  }
  .category button:hover{transform:translateY(-2px)}
  .category button.active{
    background:linear-gradient(135deg,var(--primary),var(--primary-soft));
    color:#fff;
    box-shadow:0 4px 10px rgba(0,168,168,.3);
  }
  
  /* ================= MENU LIST ================= */
  .menu{
    padding:12px;
    padding-bottom:260px;
  }
  
  .item{
    background:var(--card);
    border-radius:16px;
    padding:12px;
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:12px;
    animation:fadeUp .35s ease;
    box-shadow:var(--shadow);
    transition:.25s;
  }
  .item:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,0,0,.1);
  }
  
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
  
  .item img{
    width:74px;
    height:74px;
    border-radius:14px;
    object-fit:cover;
    flex-shrink:0;
  }
  
  .info{flex:1}
  .info b{font-size:14px;color:var(--text)}
  .price{font-size:13px;color:var(--muted);margin-top:3px}
  
  /* ================= DRINK TOGGLE ================= */
  .drink-toggle{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  
  .temp-btn{
    padding:4px 10px;
    border-radius:999px;
    border:none;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    background:rgba(0,0,0,.08);
    color:var(--text);
    transition:.25s;
  }
  body.dark .temp-btn{
    background:rgba(255,255,255,.12);
  }
  .temp-btn.active{
    background:linear-gradient(135deg,var(--primary),var(--primary-soft));
    color:#fff;
    box-shadow:0 4px 10px rgba(0,168,168,.3);
  }
  
  /* ================= BUTTON QTY ================= */
  .plus, .minus{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  
  .plus{
    background:linear-gradient(135deg,var(--primary),var(--primary-soft));
    color:#fff;
    box-shadow:0 4px 10px rgba(0,168,168,.3);
  }
  .plus:active{transform:scale(.85)}
  
  .minus{
    background:rgba(0,0,0,.08);
    color:var(--text);
  }
  body.dark .minus{
    background:rgba(255,255,255,.12);
  }
  .minus:active{transform:scale(.85)}
  
  .qty{
    min-width:26px;
    text-align:center;
    font-size:14px;
    font-weight:600;
  }
  
  /* ================= ORDER BOX ================= */
  .order-box{
    display:none;
    position:fixed;
    bottom:-380px;
    left:0;
    width:100%;
    background:var(--card);
    padding:14px 14px 16px;
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    border-top:1px solid var(--border);
    box-shadow:0 -10px 30px rgba(0,0,0,.15);
    transition:.5s cubic-bezier(.25,.8,.25,1);
    z-index:30;
  }
  .order-box.show{bottom:0}
  
  .order-list{
    font-size:14px;
    margin-bottom:8px;
  }
  .order-list div{
    display:flex;
    justify-content:space-between;
    margin-bottom:4px;
  }
  
  .total{
    font-weight:700;
    margin-bottom:8px;
    font-size:15px;
  }
  
  textarea{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:1px solid var(--border);
    margin-top:6px;
    font-size:14px;
    resize:none;
    background:transparent;
    color:var(--text);
  }
  
  .send{
    margin-top:10px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#25D366,#1ebc5b);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 6px 14px rgba(37,211,102,.35);
  }
  .send:hover{transform:translateY(-2px)}
  .send:active{transform:scale(.95)}
  
  .back-btn{
    background:none;
    border:none;
    color:var(--primary);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .back-btn:active{transform:scale(.9)}
  </style>
  </head>

/* ================= ELEMENT ================= */
const menuDiv = document.getElementById("menu");
const orderList = document.getElementById("orderList");
const totalHargaEl = document.getElementById("totalHarga");
const hero = document.getElementById("hero");
const categoryBar = document.getElementById("categoryBar");
const backBtn = document.getElementById("backBtn");
const orderBox = document.getElementById("orderBox");
const themeBtn = document.getElementById("themeBtn");

let cart = {}; // key: "Nama|dingin/panas" atau "Nama"
let currentType = null;
let activeFilter = "All";

/* ================= DARK MODE ================= */
function initTheme(){
  const saved = localStorage.getItem("theme");
  if(saved === "dark"){
    document.body.classList.add("dark");
    themeBtn.textContent = "☀️";
  }else{
    themeBtn.textContent = "🌙";
  }
}
initTheme();

function toggleTheme(){
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  localStorage.setItem("theme", dark ? "dark" : "light");
  themeBtn.textContent = dark ? "☀️" : "🌙";
}

/* ================= NAV STATE (BACK HP SAFE) ================= */
history.replaceState(
  {page:"home"},
  "",
  location.pathname + location.search + location.hash
);

window.onpopstate = function(){
  if(currentType){
    backToHome(false);
  }else{
    history.go(-1);
  }
};

function pushMenuState(){
  history.pushState(
    {page:"menu"},
    "",
    location.pathname + location.search + location.hash
  );
}

/* ================= OPEN MENU ================= */
function openMenu(type){
  currentType = type;
  activeFilter = "All";
  pushMenuState();
  hero.style.opacity = 0;
  setTimeout(()=>{
    hero.style.display = "none";
    renderCategory(type);
    categoryBar.style.display = "flex";
    backBtn.style.display = "block";
    orderBox.style.display = "block";
    setTimeout(()=>orderBox.classList.add("show"),50);
    renderMenu();
  },200);
}

/* ================= BACK TO HOME ================= */
function backToHome(push=true){
  currentType = null;
  activeFilter = "All";
  categoryBar.style.display = "none";
  backBtn.style.display = "none";
  orderBox.classList.remove("show");
  setTimeout(()=>{
    orderBox.style.display = "none";
    menuDiv.innerHTML = "";
    hero.style.display = "grid";
    hero.style.opacity = 1;
  },300);

  if(push){
    history.pushState(
  {page:"home"},
  "",
  location.pathname + location.search + location.hash
);
  }
}

/* ================= CATEGORY RENDER ================= */
function renderCategory(type){
  let cats = ["All"];
  menuData.forEach(i=>{
    if(i.tipe === type && !cats.includes(i.kategori)){
      cats.push(i.kategori);
    }
  });

  categoryBar.innerHTML = "";
  cats.forEach((c, idx)=>{
    categoryBar.innerHTML += `
      <button class="${idx===0?'active':''}" onclick="filterMenu('${c}', this)">${c}</button>
    `;
  });
}

/* ================= RENDER MENU ================= */
function renderMenu(filter=activeFilter){
  activeFilter = filter;
  menuDiv.innerHTML = "";

  menuData.forEach(item=>{
    if(item.tipe !== currentType) return;
    if(filter !== "All" && item.kategori !== filter) return;

    if(item.tipe === "minuman"){
      renderDrinkItem(item);
    }else{
      renderFoodItem(item);
    }
  });
}

/* ================= FOOD ITEM ================= */
function renderFoodItem(item){
  const qty = cart[item.nama] || 0;

  menuDiv.innerHTML += `
    <div class="item">
      <img src="${item.foto}">
      <div class="info">
        <b>${item.nama}</b>
        <div class="price">Rp ${item.harga.toLocaleString("id-ID")}</div>
      </div>
      <button class="minus" onclick="removeFood('${item.nama}')">−</button>
      <div class="qty">${qty}</div>
      <button class="plus" onclick="addFood('${item.nama}', ${item.harga})">+</button>
    </div>
  `;
}

/* ================= DRINK ITEM ================= */
function renderDrinkItem(item){
  const hasCold = item.dingin !== undefined && item.dingin !== null;
  const hasHot  = item.panas !== undefined && item.panas !== null;
  const hasToggle = hasCold && hasHot;

  const defaultMode = hasToggle ? "dingin" : "single";
  const id = Math.random().toString(36).substr(2,5);

  const coldKey = `${item.nama}|dingin`;
  const hotKey = `${item.nama}|panas`;
  const singleKey = item.nama;

  const coldQty = cart[coldKey] || 0;
  const hotQty = cart[hotKey] || 0;
  const singleQty = cart[singleKey] || 0;

  const priceNow = hasToggle
    ? (coldQty > 0 ? item.dingin : hotQty > 0 ? item.panas : item.dingin)
    : (item.harga ?? item.dingin ?? item.panas);

  const modeNow = hasToggle
    ? (coldQty > 0 ? "dingin" : hotQty > 0 ? "panas" : "dingin")
    : "single";

  menuDiv.innerHTML += `
    <div class="item" data-id="${id}">
      <img src="${item.foto}">
      <div class="info">
        <b>${item.nama}</b>

        ${hasToggle ? `
          <div class="drink-toggle">
            <button class="temp-btn ${modeNow==='dingin'?'active':''}" onclick="switchTemp('${id}','dingin',${item.dingin},${item.panas})">❄️ Dingin</button>
            <button class="temp-btn ${modeNow==='panas'?'active':''}" onclick="switchTemp('${id}','panas',${item.dingin},${item.panas})">🔥 Panas</button>
          </div>
        ` : ``}

        <div class="price" id="price-${id}">
          Rp ${priceNow.toLocaleString("id-ID")}
        </div>
      </div>

      <button class="minus" onclick="${hasToggle
        ? `removeDrink('${item.nama}','${modeNow}')`
        : `removeSingleDrink('${item.nama}')`
      }">−</button>

      <div class="qty" id="qty-${id}">
        ${hasToggle ? (modeNow==='dingin'?coldQty:hotQty) : singleQty}
      </div>

      <button class="plus" onclick="${hasToggle
        ? `addDrink('${item.nama}','${modeNow}',${item.dingin},${item.panas})`
        : `addSingleDrink('${item.nama}',${priceNow})`
      }">+</button>
    </div>
  `;
}

/* ================= SWITCH TEMP ================= */
function switchTemp(id, mode, coldPrice, hotPrice){
  const card = document.querySelector(`[data-id="${id}"]`);
  const btns = card.querySelectorAll('.temp-btn');
  btns.forEach(b=>b.classList.remove('active'));
  btns.forEach(b=>{
    if(b.textContent.includes(mode === "dingin" ? "Dingin" : "Panas")){
      b.classList.add('active');
    }
  });

  const priceEl = card.querySelector(`#price-${id}`);
  priceEl.textContent = "Rp " + (mode === "dingin" ? coldPrice : hotPrice).toLocaleString("id-ID");

  const nama = card.querySelector('b').textContent;
  const qtyEl = card.querySelector(`#qty-${id}`);
  const key = `${nama}|${mode}`;
  qtyEl.textContent = cart[key] || 0;

  card.querySelector('.plus').setAttribute("onclick", `addDrink('${nama}','${mode}',${coldPrice},${hotPrice})`);
  card.querySelector('.minus').setAttribute("onclick", `removeDrink('${nama}','${mode}')`);
}

/* ================= FILTER ================= */
function filterMenu(kat, el){
  document.querySelectorAll('.category button')
    .forEach(btn=>btn.classList.remove('active'));
  el.classList.add('active');
  renderMenu(kat);
}

/* ================= CART FOOD ================= */
function addFood(nama, harga){
  cart[nama] = cart[nama] ? cart[nama] + 1 : 1;
  bounceOrder();
  renderCart();
  renderMenu(activeFilter);
}

function removeFood(nama){
  if(cart[nama]){
    cart[nama]--;
    if(cart[nama] <= 0) delete cart[nama];
    bounceOrder();
    renderCart();
    renderMenu(activeFilter);
  }
}

/* ================= CART DRINK (WITH HOT/COLD) ================= */
function addDrink(nama, mode, coldPrice, hotPrice){
  const key = `${nama}|${mode}`;
  cart[key] = cart[key] ? cart[key] + 1 : 1;
  bounceOrder();
  renderCart();
  renderMenu(activeFilter);
}

function removeDrink(nama, mode){
  const key = `${nama}|${mode}`;
  if(cart[key]){
    cart[key]--;
    if(cart[key] <= 0) delete cart[key];
    bounceOrder();
    renderCart();
    renderMenu(activeFilter);
  }
}

/* ================= CART DRINK (SINGLE PRICE) ================= */
function addSingleDrink(nama, harga){
  cart[nama] = cart[nama] ? cart[nama] + 1 : 1;
  bounceOrder();
  renderCart();
  renderMenu(activeFilter);
}

function removeSingleDrink(nama){
  if(cart[nama]){
    cart[nama]--;
    if(cart[nama] <= 0) delete cart[nama];
    bounceOrder();
    renderCart();
    renderMenu(activeFilter);
  }
}

/* ================= RENDER CART ================= */
function renderCart(){
  orderList.innerHTML = "";
  let totalHarga = 0;

  for(let key in cart){
    const parts = key.split("|");
    const nama = parts[0];
    const mode = parts[1] || "single";
    const item = menuData.find(m=>m.nama === nama);

    let harga = 0;
    if(mode === "dingin") harga = item.dingin;
    else if(mode === "panas") harga = item.panas;
    else harga = item.harga ?? item.dingin ?? item.panas;

    totalHarga += harga * cart[key];
    orderList.innerHTML += `
      <div>
        <span>${nama}${mode!=="single" ? ` (${mode === "dingin" ? "❄️ Dingin" : "🔥 Panas"})` : ""} x${cart[key]}</span>
        <span>Rp ${(harga * cart[key]).toLocaleString("id-ID")}</span>
      </div>
    `;
  }

  if(Object.keys(cart).length === 0){
    orderList.innerHTML = "Belum ada pesanan";
  }

  totalHargaEl.innerText = "Rp " + totalHarga.toLocaleString("id-ID");
}

/* ================= BOUNCE ================= */
function bounceOrder(){
  orderBox.animate([
    {transform:'translateY(0)'},
    {transform:'translateY(-8px)'},
    {transform:'translateY(0)'}
  ],{duration:300});
}

/* ================= SEND WA ================= */
function sendWA(){
  if(Object.keys(cart).length === 0){
    alert("Pesanan masih kosong!");
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const meja = params.get("meja") || "Manual";
  const lantai = params.get("lantai") || "";

  let msg = `Pesanan Meja ${meja}${lantai ? " lantai " + lantai : ""}\n`;

  for(let key in cart){
    const parts = key.split("|");
    const nama = parts[0];
    const mode = parts[1];
    msg += `- ${nama}${mode ? ` (${mode === "dingin" ? "Dingin" : "Panas"})` : ""} x${cart[key]}\n`;
  }

  const note = document.getElementById('note').value;
  if(note.trim() !== ""){
    msg += `\nCatatan: ${note}`;
  }

  const wa = "6285835948734";
  window.location.href = `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
}
</script>
